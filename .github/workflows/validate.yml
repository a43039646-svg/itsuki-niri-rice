name: Validate Itsuki Niri Rice

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate all profiles
        run: bash scripts/validate-profiles.sh
